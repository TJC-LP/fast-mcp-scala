name: Conformance

# Runs the official MCP conformance server harness (pinned in conformance/package.json + bun.lock,
# installed with bun install --frozen-lockfile) against the fast-mcp-scala ConformanceServer over
# streamable HTTP, on all three platforms — the JVM (ZIO HTTP), Scala.js on Bun (Bun.serve), and
# Scala Native (the java.net.ServerSocket backend, as a linked LLVM binary) — and in all three
# scripts/conformance.sh modes:
#   * active — the harness's active suite: 31 scenarios / 73 checks, every one at the 2025-11-25
#     wire, checked against conformance/baseline-<platform>.yml (every baseline is empty;
#     scala-native reuses baseline-jvm.yml);
#   * 2026   — `--requirements 2026-07-28`: the scenarios that revision requires (37 scored, 118
#     checks), the only lane that sends 2026-07-28 requests. No baseline file: the harness's own
#     verdict is the gate for the scored ones. The 13 extension/pending scenarios the harness
#     runs but never scores are gated by the script, which fails when one of them fails;
#   * skills — the three Skills extension scenarios (SEP-2640: sep-2640-skills-enumeration,
#     -manifest, -directory; 32 + 6 + 7 checks, at the 2026-07-28 wire). The harness tags them
#     [extension], so neither mode above runs them. One harness run per scenario; the script
#     fails on any FAILURE, WARNING or SKIPPED check.
# native.yml runs the same three modes against the GraalVM HTTP image.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    # "MCP active suite (jvm|js)" is the pre-existing check name — keep the active lane's name stable.
    name: MCP ${{ matrix.mode }} suite (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [jvm, js, scala-native]
        mode: [active, "2026", skills]
        include:
          # Share the ci.yml Scala Native toolchain cache (nativelib/javalib/clib NIR jars) instead
          # of churning the JDK-matrix cache.
          - platform: scala-native
            cache-prefix: scala-native
    runs-on: ubuntu-latest # scala-native: clang preinstalled; SN 0.5 recommends LLVM >= 17

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          bun: "true"
          cache-prefix: ${{ matrix.cache-prefix || '' }}
          cache-write: "false" # this job executes the npm harness: restore the shared cache read-only

      # Boots the server, drives it with the pinned harness in the matrix mode, and exits with the
      # harness verdict (active: against the empty per-platform baseline — scala-native reuses
      # baseline-jvm.yml; 2026: the scored scenarios; skills: every check of the three Skills
      # extension scenarios).
      - name: Run MCP conformance ${{ matrix.mode }} (${{ matrix.platform }})
        env:
          PLATFORM: ${{ matrix.platform }}
          MODE: ${{ matrix.mode }}
        run: ./scripts/conformance.sh "$PLATFORM" 8077 "$MODE"
